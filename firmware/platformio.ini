; FLRNode firmware workspace. Environments:
;   d1_mini_pinger/ponger    : WEMOS D1 mini (ESP8266) - M1 acceptance hardware
;   esp32_dev_pinger/ponger  : ESP32 DevKit - build-only until hardware exists
;   native                   : host unit tests (Unity)
; Platform versions pinned for reproducible acceptance runs.

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DFLR_CHANNEL=1
    -Wall

[env:d1_mini_pinger]
platform = espressif8266@4.2.1
board = d1_mini
build_flags = ${env.build_flags} -DFLR_ROLE_PINGER
build_src_filter =
    +<core/>
    +<m1_frame*>
    +<ping_app*>
    +<pong_app*>
    +<transport/>
    +<led*>
    +<main.cpp>
    -<bridge_app*>

[env:d1_mini_ponger]
platform = espressif8266@4.2.1
board = d1_mini
build_flags = ${env.build_flags} -DFLR_ROLE_PONGER
build_src_filter =
    +<core/>
    +<m1_frame*>
    +<ping_app*>
    +<pong_app*>
    +<transport/>
    +<led*>
    +<main.cpp>
    -<bridge_app*>

[env:esp32_dev_pinger]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DFLR_ROLE_PINGER
build_src_filter =
    +<core/>
    +<m1_frame*>
    +<ping_app*>
    +<pong_app*>
    +<transport/>
    +<led*>
    +<main.cpp>
    -<bridge_app*>

[env:esp32_dev_ponger]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DFLR_ROLE_PONGER
build_src_filter =
    +<core/>
    +<m1_frame*>
    +<ping_app*>
    +<pong_app*>
    +<transport/>
    +<led*>
    +<main.cpp>
    -<bridge_app*>

[env:d1_mini_bridge]
platform = espressif8266@4.2.1
board = d1_mini
build_flags = ${env.build_flags} -DFLR_APP_BRIDGE
monitor_speed = 921600
build_src_filter =
    +<core/>
    +<bridge_app*>
    +<transport/>
    +<led*>
    +<main.cpp>
    -<ping_app*>
    -<pong_app*>
    -<m1_frame*>

[env:esp32_dev_bridge]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DFLR_APP_BRIDGE
monitor_speed = 921600
build_src_filter = ${env:d1_mini_bridge.build_src_filter}

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = true
build_src_filter =
    +<core/>
    +<m1_frame*>
    +<ping_app*>
    +<pong_app*>
    +<bridge_app*>
    -<main.cpp>
    -<transport/>
    -<led*>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
