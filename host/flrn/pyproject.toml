[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flrn"
version = "0.1.0"
description = "Host CLI for FLRNode encrypted radio links (Reticulum transport)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
flrn = "flrn.cli:main"

[tool.setuptools.packages.find]
include = ["flrn*"]
